name = "Our friend group"

# Inside the container: bind every interface so Caddy can reach it.
listen = "0.0.0.0:2170"

# On the relay-data volume.
database = "/data/events.db"

# The address members paste into Media Centaur. Must match the Caddyfile host.
service_url = "wss://relay.example.com"

# Admins: npubs that may add and remove members while the relay runs
# (`social-relay members add ...`) and are members themselves. At least one.
# Npubs come from Settings → Social → Your identity in Media Centaur.
admins = [
  "npub1placeholder0000000000000000000000000000000000000000000000000",
]
